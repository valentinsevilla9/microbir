<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | BIR Prep</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #020817;
        color: #f8fafc;
      }
      @media (prefers-color-scheme: light) {
        body { background: #ffffff; color: #0f172a; }
        p { color: #475569; }
      }
      main { text-align: center; padding: 24px; max-width: 420px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px;
        background: #0ea5e9; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" width="72" height="72" alt="" />
      <h1>Estás sin conexión</h1>
      <p>BIR Prep necesita internet para cargar tus datos. Si estabas haciendo un test, tus respuestas siguen guardadas en este dispositivo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
